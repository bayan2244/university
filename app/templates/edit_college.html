{% extends "base_admin.html" %}

{% block title %}Edit College{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <!-- <div class="col-md-8 col-lg-6"> -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title text-center mb-4 text-primary">Edit College</h2>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label">College Name</label>
            <input name="cname" type="text" class="form-control" value="{{ college.CNAME }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Dean Name</label>
            <input name="dname" type="text" class="form-control" value="{{ college.DNAME }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Summary</label>
            <textarea name="summary" class="form-control" rows="3">{{ college.SUMMARY }}</textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Contact</label>
            <input name="contact" type="text" class="form-control" value="{{ college.CONTACT }}">
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary px-4">💾 Save Changes</button>
            <a href="{{ url_for('main.admin_college_list') }}" class="btn btn-secondary px-4">Cancel</a>
          </div>
        </form>

      </div>
    </div>
  <!-- </div> -->
</div>
{% endblock %}
