<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>التسجيل - جامعة الحدود الشمالية</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
  <form method="POST" action="{{ url_for('main.register') }}" class="bg-white shadow-md p-8 rounded w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">إنشاء حساب جديد</h2>
    <input type="text" name="username" placeholder="اسم المستخدم" class="w-full p-2 border rounded mb-4" required>
    <input type="password" name="password" placeholder="كلمة المرور" class="w-full p-2 border rounded mb-4" required>
    <button type="submit" class="w-full bg-blue-700 text-white py-2 rounded hover:bg-blue-800 transition">سجل</button>
  </form>
</body>
</html>
