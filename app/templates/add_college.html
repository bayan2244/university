{% extends "base_admin.html" %}

{% block title %}Add New College{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <!-- <div class="col-md-8 col-lg-6"> -->

     <!-- Card -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title text-center mb-4 text-primary">Add a New College</h2>
        <form method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">College Name</label>
            <input name="cname" type="text" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Dean Name</label>
            <input name="dname" type="text" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">College Image</label>
            <input name="image_file" type="file" class="form-control" accept="image/*">
          </div>

          <div class="mb-3">
            <label class="form-label">College Summary</label>
            <textarea name="summary" class="form-control" rows="3"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Contact Info</label>
            <input name="contact" type="text" class="form-control">
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary px-4">➕ Add College</button>
            <!-- Back Button -->
            <a href="{{ url_for('main.admin_college_list') }}" class="btn btn-outline-secondary">
              ⬅ Back to Colleges
            </a>
          </div>          
        </form>
      </div>
    </div>

  <!-- </div> -->
</div>
{% endblock %}
