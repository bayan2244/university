<!-- app/templates/login.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
  <form method="POST" class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <h2 class="text-xl font-bold mb-4 text-center text-blue-700">تسجيل الدخول</h2>
    <input name="username" type="text" placeholder="اسم المستخدم" class="w-full p-2 border mb-4 rounded" required />
    <input name="password" type="password" placeholder="كلمة المرور" class="w-full p-2 border mb-4 rounded" required />
    <button type="submit" class="bg-blue-700 text-white w-full py-2 rounded hover:bg-blue-800">دخول</button>
  </form>
</body>
</html>
