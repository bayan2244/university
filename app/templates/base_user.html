    <!-- ✅ Floating Chatbox Container -->
    <div id="chatWidget" class="position-fixed bottom-0 end-0 m-3 shadow-lg bg-white rounded-3"
        style="width: 360px; display: none; flex-direction: column; z-index: 1050; border: 1px solid #ccc; overflow: hidden;">
        <div class="bg-success text-white d-flex justify-content-between align-items-center px-3 py-2">
            <span><i class="fas fa-robot me-1"></i> Ask AI</span>
            <button class="btn btn-sm btn-light" onclick="toggleChat()">×</button>
        </div>
        <div id="chatMessages" class="p-3 overflow-auto" style="height: 400px; font-size: 14px;"></div>
        <div class="p-2 border-top bg-light">
            <form onsubmit="submitQuestion(event)">
                <div class="input-group">
                    <input id="chatInput" type="text" class="form-control" placeholder="Ask something..." required>
                    <button class="btn btn-success" type="submit"><i class="fas fa-paper-plane"></i></button>
                </div>
            </form>
        </div>
    </div>

    <!-- ✅ Floating Button -->
    <button id="chatToggleBtn" class="btn btn-success rounded-circle position-fixed bottom-0 end-0 m-4 shadow"
        style="width: 60px; height: 60px; z-index: 1040;" onclick="toggleChat()" title="Ask AI">
        <i class="fas fa-comment-dots fa-lg"></i>
    </button>


    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>


    <script>
        function toggleChat() {
            const chat = document.getElementById("chatWidget");
            chat.style.display = chat.style.display === "flex" ? "none" : "flex";
        }

        async function submitQuestion(e) {
            e.preventDefault();
            const input = document.getElementById("chatInput");
            const messages = document.getElementById("chatMessages");
            const question = input.value.trim();

            if (!question) return;

            messages.innerHTML += `
        <div class="text-end mb-2">
          <span class="badge bg-primary lh-base font-monospace text-wrap px-3 py-2">${question}</span>
        </div>`;
            input.value = '';
            input.disabled = true;

            try {
                const res = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                });
                const data = await res.json();
                messages.innerHTML += `
          <div class="text-start mb-2">
            <span class="badge bg-secondary text-white text-start fs-6 lh-base font-monospace text-wrap px-3 py-2">${data.answer || "No answer found."}</span>
          </div>`;
            } catch {
                messages.innerHTML += `
          <div class="text-start mb-2 text-danger small">❌ Failed to connect to the AI.</div>`;
            }

            input.disabled = false;
            messages.scrollTop = messages.scrollHeight;
        }
    </script>


</body>
